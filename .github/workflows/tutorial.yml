name: MIT 6.7960 public tutorial
on:
  push:
    branches: [edidada/tutorial]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU experiment environment
        run: |
          python -m pip install torch==2.9.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install matplotlib==3.10.7 numpy==2.3.4
      - name: Original unittest and CPU experiment
        shell: bash
        run: |
          set -o pipefail
          mkdir -p outputs
          python -m pip freeze > outputs/environment.txt
          python -m unittest discover -s tests -v 2>&1 | tee outputs/unittest.log
          python experiment.py --device cpu 2>&1 | tee outputs/experiment.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tutorial-cpu-results
          path: outputs/
